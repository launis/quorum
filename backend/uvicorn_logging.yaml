# YAML config for uvicorn to match our logging format
version: 1
disable_existing_loggers: false

filters:
  context_filter:
    (): backend.logging_config.ContextFilter

formatters:
  default:
    format: "%(asctime)s | %(levelname)s | [%(context_id)s] | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  access:
    format: "%(asctime)s | %(levelname)s | [%(context_id)s] | uvicorn.access | %(client_addr)s - \"%(request_line)s\" %(status_code)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  default:
    class: logging.StreamHandler
    formatter: default
    filters: [context_filter]
    stream: ext://sys.stdout
  access:
    class: logging.StreamHandler
    formatter: access
    filters: [context_filter]
    stream: ext://sys.stdout

loggers:
  uvicorn:
    level: WARNING
    handlers:
      - default
    propagate: false
  uvicorn.error:
    level: WARNING
    handlers:
      - default
    propagate: false
  uvicorn.access:
    level: WARNING
    handlers:
      - access
    propagate: false
