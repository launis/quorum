[pytest]
testpaths = tests
python_files = test_*.py
norecursedirs = scripts data .git __pycache__ tests/output
addopts = -v --junitxml=tests/output/results.xml
pythonpath = .
markers =
    live: mark test as running against real external services (slow, requires env vars).
    order: mark test to run in a specific order.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

filterwarnings =
    ignore::DeprecationWarning
