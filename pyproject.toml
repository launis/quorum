[project]
name = "quorum"
version = "0.1.0"
description = "Cognitive Quorum Backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "tinydb",
    "pydantic[email]",
    "python-multipart",
    "pymupdf",
    "jinja2",
    "google-cloud-aiplatform",
    "openai",
    "python-dotenv",
    "google-api-python-client",
    "streamlit",
    "tenacity",
    "pydantic-settings",
    "python-docx",
    "litellm",
    "firebase-admin",
    "email-validator",
    "requests>=2.32.5",
    "beautifulsoup4>=4.14.3",
    "logfire[fastapi,httpx]>=4.16.0",
    "arq>=0.26.3",
    "redis>=5.3.1",
    "watchfiles>=1.1.1",
    "fakeredis>=2.33.0",
    "pyjwt>=2.10.1",
    "slowapi>=0.1.9",
    "instructor>=1.14.3",
    "sse-starlette>=2.1.3",
    "weasyprint>=63.0",
    "matplotlib>=3.10.0",
    "aiofiles>=25.1.0",
    "pymupdf4llm>=0.2.9",
    "pymupdf-layout>=1.27.2.2",
    "presidio-analyzer",
    "presidio-anonymizer",
    "bleach>=6.2.0",
    "rapidfuzz>=3.14.5",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "mkdocs-awesome-pages-plugin>=2.9.3",
    "mkdocs-swagger-ui-tag>=0.7.2",
    "mkdocstrings[python]>=1.0.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "ruff",
    "types-requests>=2.32.4.20260107",
    "types-bleach",
    "polyfactory>=3.3.0",
    "pytest-archon>=0.0.7",
    "pytest-cov>=7.1.0",
    "types-aiofiles>=25.1.0.20260409",
]

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = ["scratch", "tmp", ".venv", ".git", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
ignore = [
    "B008",  # FastAPI Depends() in default argument - standard pattern
    "E402",  # Module level import not at top - needed for dynamic imports
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D107",  # Missing docstring in __init__
    "D205",  # 1 blank line required between summary and description
    "D417",  # Missing argument description in docstring
    "UP017", # datetime.UTC vs timezone.utc - both valid
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"backend_v2/tasks/legacy_migration_tasks.py" = ["E501"]  # Long prompt strings
"backend_v2/tasks/analysis.py" = ["E501"]
"backend_v2/tasks/critique.py" = ["E501"]
"backend_v2/database/firestore_repo.py" = ["E501"]
"backend_v2/services/orchestrator/anchor_validation_service.py" = ["E501"]
"backend_v2/services/orchestrator/prompt_compiler.py" = ["E501"]
"backend_v2/services/orchestrator/schema_factory.py" = ["E501"]
"backend_v2/services/pii_analyzer.py" = ["E501"]
"backend_v2/tests/unit/services/orchestrator/test_schema_healing_prompt.py" = ["E501"]
"backend_v2/tests/unit/test_seed_architectural_guardrails.py" = ["E501"]
"scripts/backend_audit_loop.py" = ["E501", "D415"]
"scripts/flutter_audit_loop.py" = ["E501", "D415"]
"tests/unit/services/orchestrator/test_chunk_worker_validation.py" = ["E501"]
"tools/check_trace_size.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["docs/", "scratch/", "tmp/", "client_app_v2/", "tools/", "tests/", "backend_v2/tests/"]

[[tool.mypy.overrides]]
module = [
    "backend_v2.database.firestore_driver",
    "backend_v2.database.factory"
]
warn_unused_ignores = false

[tool.logfire]
ignore_no_config = true

[tool.pyrefly]
python-version = "3.14.0"
preset = "legacy"
ignore-missing-imports = ["*"]
