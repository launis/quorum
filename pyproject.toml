[project]
name = "quorum"
version = "0.1.0"
description = "Cognitive Quorum Backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "tinydb",
    "pydantic[email]",
    "python-multipart",
    "pymupdf",
    "jinja2",
    "google-cloud-aiplatform",
    "openai",
    "python-dotenv",
    "google-api-python-client",
    "streamlit",
    "tenacity",
    "pydantic-settings",
    "python-docx",
    "litellm",
    "firebase-admin",
    "email-validator",
    "requests>=2.32.5",
    "beautifulsoup4>=4.14.3",
    "logfire[fastapi,pydantic]>=4.16.0",
    "arq>=0.26.3",
    "redis>=5.3.1",
    "watchfiles>=1.1.1",
    "fakeredis>=2.33.0",
    "pyjwt>=2.10.1",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "mkdocs-swagger-ui-tag>=0.7.2",
    "mkdocstrings[python]>=1.0.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "ruff",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
# Strict enforcement: No ignores for D100-D106 (Missing Docstrings)

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true

