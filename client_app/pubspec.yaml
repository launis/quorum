name: client_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core State Management & Routing
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  go_router: ^17.0.1
  fpdart:

  # Connectivity & Data
  dio: ^5.7.0
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0
  flutter_dotenv:

  # Firebase
  firebase_core:
  firebase_auth: ^6.1.4
  firebase_ui_auth:
  firebase_ui_localizations:

  # UI & UX
  flutter_localizations:
    sdk: flutter
  intl:
  flex_color_scheme:
  flutter_animate:
  google_fonts:
  shared_preferences:
  flutter_markdown_plus: ^1.0.7
  file_picker:
  collection:
  fl_chart:
  pdf:
  printing:
  file_saver:
  url_launcher:
  flutter_hooks: ^0.21.0
  hooks_riverpod: ^3.1.0
  logger:
  path_provider:

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Dev Tools & Code Generation
  build_runner: ^2.6.1
  riverpod_generator: ^4.0.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  json_serializable: ^6.11.2
  freezed: ^3.2.3
  flutter_lints:
  mocktail:
  mockito: ^5.6.0
  go_router_builder: ^4.1.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
