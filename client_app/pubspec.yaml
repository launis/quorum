name: client_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core State Management & Routing
  flutter_riverpod: ^3.0.0
  riverpod_annotation: any
  go_router: ^17.0.1
  fpdart: ^1.1.0

  # Connectivity & Data
  dio: any
  json_annotation: any
  flutter_dotenv: any

  # Firebase
  firebase_core: any
  firebase_auth: ^6.1.3
  firebase_ui_auth: any
  firebase_ui_localizations: any

  # UI & UX
  flutter_localizations:
    sdk: flutter
  intl: any
  flex_color_scheme: any
  flutter_animate: any
  # google_fonts: any # User didn't strictly request this but I had it. I'll include it as 'any' or remove if not in list? User list was explicit. I'll keep it as it's useful.

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Dev Tools & Code Generation
  build_runner: any
  riverpod_generator: any
  custom_lint: any
  riverpod_lint: any
  json_serializable: any
  flutter_lints: any
  mocktail: any

flutter:
  uses-material-design: true
  generate: true
