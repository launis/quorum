name: Check OpenAPI Sync

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  check-api-sync:
    name: Check OpenAPI Sync
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Generate OpenAPI Spec
        env:
          VERTEX_LOCATION: "europe-north1"
          USE_MOCK_LLM: "true"
          USE_MOCK_DB: "true"
          STORAGE_BACKEND: "POSTGRES"
        run: uv run backend_v2/scripts/generate_openapi.py
        
      - name: Verify or Auto-commit
        run: |
          if git diff --quiet docs/swagger/openapi.json; then
            echo "OpenAPI schema is up to date."
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "OpenAPI schema out of sync on main; auto-committing updated openapi.json..."
            git add docs/swagger/openapi.json
            git commit -m "chore(api): auto-synchronize openapi.json [skip ci]"
            git push
          else
            echo "Error: docs/swagger/openapi.json is out of sync!"
            echo "Please run 'uv run backend_v2/scripts/generate_openapi.py' locally and commit the changes."
            git diff docs/swagger/openapi.json
            exit 1
          fi
