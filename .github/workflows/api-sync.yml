name: Check OpenAPI Sync

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-api-sync:
    name: Check OpenAPI Sync
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Generate OpenAPI Spec
        env:
          VERTEX_LOCATION: "europe-north1"
        run: uv run backend_v2/scripts/generate_openapi.py
        
      - name: Verify synchronization
        run: |
          git diff --exit-code docs/swagger/openapi.json
          if [ $? -ne 0 ]; then
            echo "Error: docs/swagger/openapi.json is out of sync!"
            echo "Please run 'uv run backend_v2/scripts/generate_openapi.py' locally and commit the changes."
            exit 1
          fi
