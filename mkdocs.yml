site_name: Cognitive Quorum
site_description: Enterprise AI Orchestration Engine (2026 SOTA)

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
  palette:
    scheme: slate
    primary: indigo
    accent: indigo

plugins:
  - search
  - mkdocstrings:
      default_handler: python
  - awesome-pages

nav:
  - Etusivu: index.md
  - 🏛️ Arkkitehtuurimäärittely (The Modular Engine):
    - 00. Yhteenveto & Säännöt: architecture/00_executive_summary.md
    - 01. API-kerros ja Asynkroninen Core: architecture/01_backend_api_and_core.md
    - 02. Pydantic-tietomalli & Fail-Fast: architecture/02_domain_models.md
    - 03. Työnkulkujen Orkestraatio (DAG): architecture/03_business_services_and_dag.md
    - 04. Tekoälyn Hooks & LLM Päätepisteet: architecture/04_hooks_and_llm.md
    - 05. Yhteystasot, CQRS & The Seed Vault: architecture/05_data_persistence_and_seeding.md
    - 06. Esityskerros (Desktop-first Flutter): architecture/06_desktop_first_flutter_client.md
    - 07. Infrastruktuuri & Observability: architecture/07_infrastructure_and_observability.md
  - 🧠 Kognitiivinen Orkestraatio (Teoria):
    - Holistinen Mestaruus: "Holistinen Mestaruus.md"
    - Agent Workflows Opas: Agent_Workflows_Opas.md
  - 🚀 Epics & Features:
      - '...'
  - ⚙️ API Swagger Docs: swagger/index.md
